// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea"
        }
    }
    dependencies {
        // FIXED: Downgraded to match the stable library version used in App module
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.8.5"
    }
}

plugins {
    id 'com.android.application' version '8.8.2' apply false
    id 'com.android.library' version '8.8.2' apply false
    // FIXED: Downgraded to 1.9.24 to ensure compatibility with Hilt 2.51 & Compose
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    // FIXED: Updated to 2.51 to MATCH your App module dependencies
    id 'com.google.dagger.hilt.android' version '2.51' apply false
}